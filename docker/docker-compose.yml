services:
  kiro-gateway:
    image: ghcr.io/jwadow/kiro-gateway:latest
    container_name: kiro-gateway
    ports:
      - "8000:8000"
    volumes:
      - ~/.aws/sso/cache:/home/kiro/.aws/sso/cache:ro
      - ./start_no_ssl_verify.py:/app/start_no_ssl_verify.py:ro
    command: ["python", "start_no_ssl_verify.py"]
    env_file:
      - ../.env
    environment:
      - KIRO_CREDS_FILE=/home/kiro/.aws/sso/cache/kiro-auth-token-cli.json
    restart: unless-stopped
